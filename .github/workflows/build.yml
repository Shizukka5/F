name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Download Gradle 8.10.2
        run: |
          curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle.zip -d $HOME/gradle-dist
      - name: Build
        run: $HOME/gradle-dist/gradle-8.10.2/bin/gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: chunkswap-mod
          path: build/libs/*.jar
